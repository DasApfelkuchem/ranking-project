<?xml version="1.0" encoding="UTF-8"?>
<!--
  Simple SVG logo: "Flatland" with small "ranking" underneath.
  Uses font-family "GoodBrush" as requested; place the Good Brush font file at
  "fonts/GoodBrush-Regular.ttf" and uncomment the @font-face in your CSS to apply.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="100" viewBox="0 0 420 100" role="img" aria-label="Flatland ranking logo">
  <defs>
    <style>
      /* If you add Good Brush font to fonts/GoodBrush-Regular.ttf, enable this @font-face in styles.css instead:
      @font-face {
        font-family: 'GoodBrush';
        src: url('fonts/GoodBrush-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      */
    </style>
  </defs>
  <rect width="100%" height="100%" fill="transparent" />
  <!-- Decorative mark (stem/curve) inspired by the IUF logo you attached -->
  <g transform="translate(8,8) scale(0.9)" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 42 C18 18, 62 18, 62 42 C62 62, 28 74, 18 84" opacity="0.9" />
    <path d="M92 10 C112 6, 132 6, 152 12" opacity="0.95" />
  </g>

  <!-- Main title -->
  <text x="160" y="50" font-family="GoodBrush, 'Brush Script MT', 'Segoe UI', sans-serif" font-size="42" fill="#ffffff">Flatland</text>
  <!-- Small subtitle (ranking) -->
  <text x="160" y="78" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#cfeeff">ranking</text>
</svg>
